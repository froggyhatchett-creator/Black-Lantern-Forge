[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "black-lantern-mercy"
version = "0.2.0"
description = "Mercy v0.2 — The Vessel"
requires-python = ">=3.11"
dependencies = []

[project.gui-scripts]
mercy = "mercy.ui:main"

[tool.setuptools.package-data]
mercy = ["identity.json"]

[tool.setuptools.packages.find]
include = ["mercy*"]
